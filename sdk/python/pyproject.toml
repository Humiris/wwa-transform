[project]
name = "agentizer"
version = "1.0.0"
description = "Python SDK for the Agentizer transform API — turn any website into an AI-powered agentfront."
authors = [{name = "Iris Lab", email = "hello@codiris.app"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
keywords = ["agentizer", "agentfront", "ai-agent", "mcp", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# No required dependencies — falls back to stdlib urllib.
# `requests` will be used automatically if installed for connection pooling.
dependencies = []

[project.optional-dependencies]
fast = ["requests>=2.28"]

[project.urls]
Homepage = "https://codiris.app/skills"
Repository = "https://github.com/Humiris/wwa-transform"
Issues = "https://github.com/Humiris/wwa-transform/issues"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agentizer"]
